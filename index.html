<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Live — Bingo</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #fff;
    min-height: 100vh;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .logo {
    margin: 32px 16px 24px;
    max-width: 420px;
    width: 82%;
  }
  .logo img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 20px;
  }
  #board {
    width: min(92vw, 520px);
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    background: #f4f6f3;
    padding: 12px;
    border-radius: 20px;
    border: 1px solid #e7ece5;
  }
  .cell {
    aspect-ratio: 1 / 1;
    border: 1px solid #e2e8e0;
    border-radius: 14px;
    background: #fff;
    color: #1a1a1a;
    font-size: 12px;
    line-height: 1.3;
    padding: 8px 6px;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    transition: background .15s, color .15s, border-color .15s, transform .08s;
  }
  .cell:hover { border-color: #44b844; }
  .cell:active { transform: scale(.96); }
  .cell.marked {
    background: #3faf46;
    border-color: #3faf46;
    color: #fff;
  }
  .howto {
    width: min(92vw, 520px);
    margin-top: 12px;
    background: #f4f6f3;
    border: 1px solid #e7ece5;
    border-radius: 16px;
    padding: 14px 16px;
    font-size: 13px;
    line-height: 1.6;
    color: #333;
  }
  .howto b { color: #2e9e3e; }
  @media (max-width: 480px) {
    .cell { font-size: 10px; padding: 6px 4px; }
  }
</style>
</head>
<body>

<div class="logo">
  <img src="logo.png" alt="Minecraft Live">
</div>

<div id="board"></div>

<div class="howto">
  <b>Як грати:</b> дивись трансляцію → натискай клітинку, коли подія сталася → збери 5 в ряд (рядок, стовпчик або діагональ) → <b>БІНГО!</b> Центр ★ вже зараховано.
</div>

<script>
const PREDICTIONS = [
  "End Update",
  "Dungeons 2 геймплей",
  "Локація The Sift",
  "Зимовий Game Drop",
  "Новий моб",
  "Нові дерева / рослинність",
  "Нові блоки",
  "Графіка / шейдери",
  "Новий данж",
  "Новий крафт",
  "Новий редстоун",
  "Моб з голосувань",
  "Quality of Life",
  "Агнес у светрі",
  "“Change the way you play”",
  "Парки Minecraft World",
  "Кіно / анімація",
  "Marketplace доповнення",
  "Новий мерч",
  "Музичний диск",
  "Жарт про меми",
  "Техпроблеми ефіру",
  "Deep Dig розбір",
  "“One more thing…”"
];

const board = document.getElementById('board');
let state = new Array(25).fill(false);
state[12] = true;

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

const list = shuffle([...PREDICTIONS]);
const full = [...list.slice(0,12), '★', ...list.slice(12)];

full.forEach((text, i) => {
  const d = document.createElement('div');
  d.className = 'cell' + (state[i] ? ' marked' : '');
  d.textContent = text;
  d.addEventListener('click', () => {
    state[i] = !state[i];
    d.classList.toggle('marked', state[i]);
  });
  board.appendChild(d);
});
</script>
</body>
</html>
