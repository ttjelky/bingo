<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Live — Bingo</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #f5f5f7;
    min-height: 100vh;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 48px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .logo {
    margin: 40px 16px 28px;
    max-width: 420px;
    width: 82%;
  }
  .logo img {
    width: 100%;
    height: auto;
    display: block;
  }
  #board {
    width: min(92vw, 520px);
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    background: #fff;
    padding: 12px;
    border-radius: 24px;
    border: none;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
  }
  .cell {
    aspect-ratio: 1 / 1;
    border: none;
    border-radius: 16px;
    background: #f5f5f7;
    color: #1d1d1f;
    font-size: 12px;
    line-height: 1.3;
    padding: 8px 6px;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    transition: background .15s, color .15s, transform .08s, box-shadow .15s;
  }
  .cell:hover { background: #e8f5e9; }
  .cell:active { transform: scale(.96); }
  .cell.marked {
    background: #3faf46;
    border: none;
    color: #fff;
    box-shadow: 0 4px 12px rgba(63,175,70,.4);
  }
  .cell.win {
    animation: winPulse .7s ease-in-out infinite alternate;
    box-shadow: 0 4px 18px rgba(63,175,70,.65);
  }
  @keyframes winPulse {
    from { transform: scale(1); }
    to { transform: scale(1.07); }
  }
  #winToast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%) translateY(20px) scale(.9);
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,.9);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border-radius: 999px;
    padding: 12px 22px 12px 14px;
    font-size: 17px;
    font-weight: 600;
    color: #1d1d1f;
    box-shadow: 0 12px 32px rgba(0,0,0,.16);
    opacity: 0;
    pointer-events: none;
    transition: opacity .35s, transform .45s cubic-bezier(.34,1.56,.64,1);
    z-index: 50;
  }
  #winToast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
  }
  #winToast .check {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #3faf46;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }
  #confetti {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 40;
  }
  .confetti-piece {
    position: absolute;
    top: -14px;
    border-radius: 3px;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    to { transform: translateY(105vh) rotate(720deg); opacity: .9; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cell.win { animation: none; }
    .confetti-piece { display: none; }
  }
  .credit {
    margin-top: 20px;
    font-size: 13px;
    color: #aeaeb2;
  }
  @media (max-width: 480px) {
    .cell { font-size: 10px; padding: 6px 4px; }
  }
</style>
</head>
<body>

<div class="logo">
  <img src="logo.png" alt="Minecraft Live">
</div>

<div id="board"></div>

<div id="winToast"><span class="check">✓</span>Бінго!</div>
<div id="confetti"></div>

<div class="credit">Зроблено з любов'ю CuteJelky</div>

<script>
const PREDICTIONS = [
  "End Update",
  "Dungeons 2 геймплей",
  "Локація The Sift",
  "Зимовий Game Drop",
  "Новий моб",
  "Нові дерева / рослинність",
  "Нові блоки",
  "Графіка / шейдери",
  "Новий данж",
  "Новий крафт",
  "Новий редстоун",
  "Моб з голосувань",
  "Quality of Life",
  "Агнес у светрі",
  "“Change the way you play”",
  "Парки Minecraft World",
  "Кіно / анімація",
  "Marketplace доповнення",
  "Новий мерч",
  "Музичний диск",
  "Жарт про меми",
  "Техпроблеми ефіру",
  "Deep Dig розбір",
  "“One more thing…”"
];

const board = document.getElementById('board');
const toast = document.getElementById('winToast');
const confettiBox = document.getElementById('confetti');
const cells = [];
let state = new Array(25).fill(false);
state[12] = true;
let wasWin = false;

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function winLines(){
  const L=[];
  for(let r=0;r<5;r++) L.push([0,1,2,3,4].map(c=>r*5+c));
  for(let c=0;c<5;c++) L.push([0,1,2,3,4].map(r=>r*5+c));
  L.push([0,6,12,18,24]);
  L.push([4,8,12,16,20]);
  return L;
}

function celebrate(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors=['#3faf46','#7ed957','#1d1d1f','#ffcf2e','#ffffff'];
  for(let i=0;i<70;i++){
    const p=document.createElement('div');
    p.className='confetti-piece';
    const s=6+Math.random()*8;
    p.style.left=Math.random()*100+'vw';
    p.style.width=s+'px';
    p.style.height=(s*0.6)+'px';
    p.style.background=colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDuration=(2.2+Math.random()*1.8)+'s';
    p.style.animationDelay=(Math.random()*0.4)+'s';
    confettiBox.appendChild(p);
    setTimeout(()=>p.remove(),4500);
  }
}

function update(){
  cells.forEach(c=>c.classList.remove('win'));
  const won = winLines().some(line=>{
    if(line.every(i=>state[i])){
      line.forEach(i=>cells[i].classList.add('win'));
      return true;
    }
    return false;
  });
  toast.classList.toggle('show',won);
  if(won && !wasWin) celebrate();
  wasWin = won;
}

const list = shuffle([...PREDICTIONS]);
const full = [...list.slice(0,12), '★', ...list.slice(12)];

full.forEach((text, i) => {
  const d = document.createElement('div');
  d.className = 'cell' + (state[i] ? ' marked' : '');
  d.textContent = text;
  d.addEventListener('click', () => {
    state[i] = !state[i];
    d.classList.toggle('marked', state[i]);
    update();
  });
  board.appendChild(d);
  cells.push(d);
});
update();
</script>
</body>
</html>
